<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Calculadora</h1>
    </header>
    <main>
        <div class="calculator">
            <div class="calculator_display">0</div>
            <div class="calculator_keys">
               <button class="key_operator" data-action="add">+</button>
               <button class="key_operator" data-action="subtract">-</button>
               <button class="key_operator" data-action="multiply">&times;</button>
               <button class="key_operator" data-action="divide">÷</button>
               <button>7</button>
               <button>8</button>
               <button>9</button>
               <button>4</button>
               <button>5</button>
               <button>6</button>
               <button>1</button>
               <button>2</button>
               <button>3</button>
               <button>0</button>
               <button data-action="decimal">.</button>
               <button data-action="clear">AC</button>
               <button class="key_equal" data-action="calculate">=</button>
            </div>
        </div>
    </main>
    <footer>
        <p>Desenvolvido por Ana Luiza.</p>
    </footer>
    <script src="index.js"></script>
</body>
</html>
