<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Slide Show</title>
</head>
<body>
    <div class="allcontent">
    <div class="slider">
        <div class="content">
            <img src="imagens/img-pexels-1-600.jpg">
            <img src="imagens/img-pexels-2-600.jpg">
            <img src="imagens/img-pexels-3-600.jpg">
            <img src="imagens/img-pexels-4-600.jpg">
            <img src="imagens/img-pexels-gato-600.jpg">
        </div>
    </div>
        <button id="prevSlide">◀</button>
        <button id="nextSlide">▶</button>
        <div class="tamDot">
            <span class="dot"></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
