<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cálculo IMC</h1>
    </header>
    <main>
        <label for="peso">Peso: <input type="number" name="peso" id="peso" placeholder="Quilos" oninput="mascaraPeso()"></label><br>

        <label for="altura">Altura: <input type="number" name="altura" id="altura" placeholder="Metros" oninput="mascaraAltura()"></label><br>

        <button type="submit" onclick="calcular()">Calcular</button>
        <button type="reset" onclick="limpar()">Limpar</button>

        <div id="resultado">
            Resultado.
        </div>
    </main>
    <footer>
        <p>Criado por Ana Luiza.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
