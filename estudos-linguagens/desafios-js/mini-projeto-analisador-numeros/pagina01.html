<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <section>

        <div>
          <label for="numero">Número (entre 1 e 100): <input type="number" name="numero" id="numero"></label> <button type="submit" onclick="adicionar()">Adicionar</button>
        </div>

        <div>
            <p><label for="adicionarNumeros"></label><select name="adicionarNumeros" id="adicionarNumeros" size="10"></select></p>
            
            <p><button type="submit" onclick="finalizar()">Finalizar</button></p>
        </div>

        <div id="contas"> </div>
    </section>
    <footer>
        <p>&copy; Ana Luiza</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
